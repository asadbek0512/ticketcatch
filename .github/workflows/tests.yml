name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Parsers, i18n tables and the airport index are all pure functions — no browser and no
      # network, so CI never touches a live source. A test that scraped Trip.com would fail on
      # their next redesign rather than on ours.
      - name: Install
        run: uv sync --python 3.11

      - name: Test
        run: uv run pytest tests -q

      - name: Import check
        run: uv run python -m compileall -q src

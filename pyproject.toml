[project]
name = "ticketcatch"
version = "0.1.0"
description = "Telegram flight-price watcher (ICN <-> TAS) — cheapest tickets across sources, twice a day"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "aiogram>=3.13",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pydantic-settings>=2.5",
    "playwright>=1.61.0",
    "fast-flights>=2.2",
    "typing-extensions>=4.12",
]

[project.scripts]
ticketcatch = "ticketcatch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketcatch"]

[tool.ruff]
line-length = 100
target-version = "py311"
